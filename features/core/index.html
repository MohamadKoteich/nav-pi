<div id="app">
  <!-- status bar = information only (2026-11-22): clock, now playing, Bluetooth, Wi-Fi, GPS
       (the temperature is on Settings > Pi health). No controls besides the now-playing chip (play/pause), no pull-down. Each feature fills its own chip. -->
  <header id="status">
    <span class="clock num" id="clock">--:--</span>
    <span class="spacer"></span>
    <button class="chip np" id="np-chip" hidden></button>
    <span class="chip off" id="bt-chip" hidden><svg class="i"><use href="#i-bt"/></svg></span>
    <span class="chip off" id="wifi-chip" hidden><svg class="i"><use href="#i-wifi"/></svg></span>
    <span class="chip off" id="gps-chip" title="GPS"><svg class="i"><use href="#i-gps-off"/></svg><span id="gps-text" data-i18n="gps.none"></span></span>
  </header>

  <main id="views">

<!--@VIEWS-->
    <!-- Settings (2026-11-22): category rail left, one category's cards right.
         Every card carries data-cat; settings.js builds the rail from the categories that have a card in this edition. -->
    <section class="view" id="settings" data-i18n-label="settings">
      <aside class="st-rail">
        <div class="st-rail-head"><button class="back" id="settings-back" data-i18n-label="back"><svg class="i"><use href="#i-back"/></svg></button><h1 data-i18n="settings"></h1></div>
        <nav class="st-nav" id="st-nav" aria-label="Settings"></nav>
      </aside>
      <div class="st-main">
        <header class="st-head"><h2 class="st-title" id="st-title"></h2></header>
        <div class="st-pane" id="st-pane">
      <div class="card" id="lang-card" data-cat="system">
        <div class="card-h"><svg class="i"><use href="#i-globe"/></svg><span class="t" data-i18n="lang"></span></div>
        <div class="seg" id="langs"><button data-lang="en">English</button><button data-lang="de">Deutsch</button></div>
      </div>
<!--@SETTINGS-->
      <div class="about" id="about" data-cat="system"></div>
        </div>
      </div>
    </section>
  </main>

  <nav id="dock" aria-label="Apps">
<!--@DOCK-->
    <button data-go="settings" class="dock-set"><svg class="i"><use href="#i-gear"/></svg><span data-i18n="settings"></span></button>
  </nav>
  <div id="kbd" aria-hidden="true"></div>
  <div id="toast" role="status"></div>
</div>

<!--@SCRIPTS-->
<script>Shell.start();</script>
</body>
</html>
