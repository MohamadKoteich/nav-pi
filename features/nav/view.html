    <section class="view" id="maps" data-i18n-label="app.maps">
      <div id="map"></div>
      <div id="searchbar"><svg class="i"><use href="#i-search"/></svg>
        <input id="q" data-i18n-ph="search.ph" autocomplete="off" inputmode="none" data-i18n-label="search.ph">
        <button id="q-clear" data-i18n-label="search.close" hidden><svg class="i"><use href="#i-close"/></svg></button></div>
      <div id="search-results" role="listbox"></div>
      <!-- every round map button lives in this stack (bottom-up); features append theirs here, never position one themselves -->
      <div id="fabs"><button class="fab" id="btn-recenter" data-i18n-label="recenter"><svg class="i"><use href="#i-locate"/></svg></button></div>

      <div id="banner" aria-live="polite">
        <div class="now"><div class="arrow" id="b-arrow"></div>
          <div style="min-width:0;flex:1"><div class="dist num" id="b-dist"></div><div class="street" id="b-street"></div></div></div>
        <div class="then" id="b-then"><span data-i18n="then"></span><span id="b-then-arrow"></span><span id="b-then-text"></span></div>
      </div>
      <div id="tripbar">
        <div class="eta"><div class="a num" id="t-arrive">--:--</div><div class="r num" id="t-rest"></div></div>
        <button class="stop" id="btn-stop" data-i18n-label="stopNav"><svg class="i"><use href="#i-close"/></svg></button>
      </div>
      <!-- speed cluster (2026-11-22, Waze-like): current speed + the speed-limit sign, above the ETA bar while guiding;
           the speed turns red when over the limit (speedlimit.js) -->
      <div id="speedo">
        <div class="speed num"><span id="t-speed">–</span><small>km/h</small></div>
        <div class="limit num" id="t-limit" hidden><b></b></div>
      </div>

      <div id="sheet" aria-live="polite">
        <div class="from"><button class="from-btn" id="s-from"><span class="dot"></span><span class="lbl" data-i18n="from"></span><span class="nm" id="s-from-name"></span></button>
          <button class="swap" id="s-swap" data-i18n-label="swap"><svg class="i" viewBox="0 0 24 24"><path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3 5 6.99h3V14h2V6.99h3L9 3z"/></svg></button></div>
        <!-- PN-37 stops between start and destination: up / down / remove; the last stop's down swaps it with the destination -->
        <div class="stops" id="s-stops"></div>
        <div class="destrow"><div class="main"><div class="dest" id="s-dest"></div><div class="ctx" id="s-ctx"></div></div>
          <button class="ico" id="s-addstop" data-i18n-label="stop.add"><svg class="i"><use href="#i-addstop"/></svg></button>
          <button class="ico" id="s-save" data-i18n-label="fav.save"><svg class="i" viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>
          <button class="ico" id="s-opts" data-i18n-label="ro.title"><svg class="i" viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg></button></div>
        <!-- PN-35 route choices (time, distance, via the main road); tap one or its grey line on the map -->
        <div class="alts" id="s-alts" role="radiogroup"></div>
        <div class="facts num"><span><b id="s-time"></b></span><span id="s-dist"></span><span id="s-arrive"></span></div>
        <div class="actions">
          <button class="btn ghost" id="s-cancel" data-i18n-label="cancel"><svg class="i"><use href="#i-close"/></svg></button>
          <button class="btn ghost" id="s-sim"><svg class="i"><use href="#i-sim"/></svg><span data-i18n="simulate"></span></button>
          <button class="btn primary" id="s-go"><svg class="i"><use href="#i-nav"/></svg><span data-i18n="go"></span></button>
        </div>
      </div>
      <div id="pick">
        <div class="ctx" id="p-ctx"></div>
        <div class="actions">
          <button class="btn ghost" id="p-cancel" data-i18n-label="cancel"><svg class="i"><use href="#i-close"/></svg></button>
          <button class="btn ghost" id="p-start"><svg class="i"><use href="#i-sim"/></svg><span data-i18n="pick.start"></span></button>
          <button class="btn ghost sq" id="p-save" data-i18n-label="fav.save"><svg class="i" viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>
          <button class="btn primary" id="p-dest"><svg class="i"><use href="#i-nav"/></svg><span data-i18n="pick.dest"></span></button>
        </div>
        <div class="actions sub">
          <button class="btn ghost" id="p-stop"><svg class="i"><use href="#i-addstop"/></svg><span data-i18n="stop.add"></span></button>
          <button class="btn ghost" id="p-park"><svg class="i"><use href="#i-park"/></svg><span data-i18n="park.here"></span></button>
        </div>
      </div>
      <!-- nav icons (Material shapes) used by maps.js rows -->
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-addstop" viewBox="0 0 24 24"><path d="M20 1v3h3v2h-3v3h-2V6h-3V4h3V1h2zm-8 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm2-9.75V7h3v3h2.92c.05.39.08.79.08 1.2 0 3.32-2.67 7.25-8 11.8-5.33-4.55-8-8.48-8-11.8C4 6.22 7.8 3 12 3c.68 0 1.35.08 2 .25z"/></symbol>
        <symbol id="i-park" viewBox="0 0 24 24"><path d="M13 3H6v18h4v-6h3a6 6 0 0 0 0-12zm.2 8H10V7h3.2a2 2 0 0 1 0 4z"/></symbol>
        <symbol id="i-walk" viewBox="0 0 24 24"><path d="M13.5 5.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A7.3 7.3 0 0 0 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6z"/></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="m4 12 1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8z"/></symbol>
        <symbol id="i-down" viewBox="0 0 24 24"><path d="m20 12-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8z"/></symbol>
      </svg>
      <!-- PN-34 save / rename / delete a place (Home, Work, favourite); the on-screen keyboard types the name -->
      <div id="placeform" class="navpanel" role="dialog">
        <div class="ttl" id="pf-title"></div>
        <div class="pf-in" id="pf-in"><input id="pf-name" inputmode="none" autocomplete="off" data-i18n-ph="fav.name" data-i18n-label="fav.name">
          <button class="ico" id="pf-clear" data-i18n-label="fav.clear"><svg class="i"><use href="#i-close"/></svg></button></div>
        <div class="actions" id="pf-kinds">
          <button class="btn ghost" id="pf-home"><svg class="i" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span data-i18n="fav.home"></span></button>
          <button class="btn ghost" id="pf-work"><svg class="i" viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg><span data-i18n="fav.work"></span></button></div>
        <div class="actions">
          <button class="btn ghost sq" id="pf-cancel" data-i18n-label="cancel"><svg class="i"><use href="#i-close"/></svg></button>
          <button class="btn danger sq" id="pf-del" data-i18n-label="fav.delete"><svg class="i"><use href="#i-trash"/></svg></button>
          <button class="btn primary" id="pf-save"><svg class="i" viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg><span id="pf-save-l"></span></button></div>
      </div>
      <!-- PN-33 route options (avoid motorways / tolls / ferries / unpaved), kept on this device -->
      <div id="ropts" class="navpanel" role="dialog">
        <div class="ttl" data-i18n="ro.title"></div>
        <div class="ro-list" id="ro-list"></div>
        <div class="actions"><button class="btn primary" id="ro-done"><span data-i18n="ro.done"></span></button></div>
      </div>
    </section>
